[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2word"
dynamic = ["version"]
description = "Turn PDF papers, books and manuals into Word documents or Obsidian notes: layout-aware text, equations as image + OCR (Word math / LaTeX), figures, front matter; big PDFs split by bookmark chapters."
readme = "README.md"
# 3.13+ is excluded: rapid_latex_ocr needs numpy < 2, which has no wheels for Python 3.13 or newer.
# Only 3.12: main_gui.bat creates and accepts 3.12 environments only (PY_MIN / PY_MAX / PY_TOP), see .python-version.
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
keywords = ["pdf", "word", "docx", "obsidian", "markdown", "latex", "ocr", "paper", "book", "manual", "bookmarks", "chapters"]
dependencies = [
    "pymupdf>=1.26.4,<2",
    "pymupdf4llm>=1.26,<2",
    "pymupdf-layout>=1.26,<2",
    "rapid_latex_ocr>=0.0.9",
    "onnxruntime>=1.17",
    "tokenizers>=0.20",
    "requests>=2.28",
    "numpy>=1.24",
    "Pillow>=10",
    "python-docx>=1.1",
    "latex2mathml>=3.77",
]

[project.optional-dependencies]
claude = ["anthropic>=0.60"]
dev = ["pytest>=7"]

[project.scripts]
pdf2word = "pdf2word.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pdf2word.__version__" }

[tool.setuptools.packages.find]
include = ["pdf2word*"]
